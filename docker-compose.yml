services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sierra
      POSTGRES_PASSWORD: sierra
      POSTGRES_DB: sierra
    ports:
      - "54330:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sierra"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sierra
      MINIO_ROOT_PASSWORD: sierra-secret
    ports:
      - "9110:9000"
      - "9111:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 sierra sierra-secret; do sleep 1; done;
      mc mb --ignore-existing local/sierra-files;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
