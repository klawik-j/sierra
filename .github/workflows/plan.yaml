name: Plan

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/**"
      - "!infra/bootstrap/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/plan.yaml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STATE_KEY: sierra/terraform.tfstate

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  plan:
    name: Plan infrastructure changes
    runs-on: ubuntu-latest
    # Fork pull requests receive no OIDC token, so there is nothing to plan with.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check out pull request source
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Validate Terraform
        working-directory: infra
        run: terraform validate

      - name: Create plan
        id: plan
        working-directory: infra
        run: |
          set +e
          terraform plan -lock=false -no-color -out=tfplan > plan.txt 2>&1
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          tail -c 60000 plan.txt
          exit "$exit_code"

      - name: Comment plan on pull request
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan:infra -->';
            const limit = 60000;

            let output = '';
            try {
              output = fs.readFileSync('infra/plan.txt', 'utf8');
            } catch {
              output = 'Terraform did not produce any plan output.';
            }

            let truncated = false;
            if (output.length > limit) {
              output = output.slice(-limit);
              truncated = true;
            }

            const succeeded = '${{ steps.plan.outputs.exit_code }}' === '0';
            const body = [
              marker,
              succeeded ? '### Terraform plan' : '### Terraform plan failed',
              '',
              truncated ? '_Output truncated. See the workflow logs for the full plan._' : '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              output,
              '```',
              '',
              '</details>',
              '',
              'Merging to `master` applies this plan and deploys the application.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
